name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configuration du SDK Android
        uses: android-actions/setup-android@v3

      - name: Configuration de Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Lancer les tests unitaires
        run: gradle test --stacktrace

      - name: Construire l'APK debug
        run: gradle assembleDebug --stacktrace

      - name: Publier l'APK comme artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: clipsort-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
