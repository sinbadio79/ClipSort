name: Android CI

on:
  push:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout du code
        uses: actions/checkout@v5

      - name: Configuration JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accepter les licences SDK et installer la plateforme 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configuration de Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Tests unitaires et intégration Room
        run: gradle testDebugUnitTest --stacktrace

      - name: Lint Android
        run: gradle lintDebug --stacktrace

      - name: Construire l'APK debug
        run: gradle assembleDebug --stacktrace

      - name: Construire la version release avec R8
        run: gradle assembleRelease --stacktrace

      - name: Rapports de vérification et schémas Room
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/schemas/
          retention-days: 14

      - name: Publier l'APK comme artefact téléchargeable
        uses: actions/upload-artifact@v6
        with:
          name: clipsort-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
