name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v5

      - name: Configuration JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accepter les licences SDK et installer la plateforme 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configuration de Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Lancer les tests unitaires
        run: gradle test --stacktrace

      - name: Construire l'APK debug
        run: gradle assembleDebug --stacktrace

      - name: Publier l'APK comme artefact téléchargeable
        uses: actions/upload-artifact@v6
        with:
          name: clipsort-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30