name: Android CI

on:
  push:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout du code
        uses: actions/checkout@v5

      - name: Configuration JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accepter les licences SDK et installer la plateforme 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configuration de Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Tests unitaires et intégration Room
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint Android
        run: ./gradlew lintDebug --stacktrace

      - name: Construire l'APK debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Construire la version release avec R8
        run: ./gradlew assembleRelease --stacktrace

      - name: Vérifier que les schémas Room sont versionnés
        run: |
          changes=$(git status --porcelain -- app/schemas)
          if [ -n "$changes" ]; then
            echo "Les schémas générés diffèrent des schémas versionnés :"
            echo "$changes"
            exit 1
          fi

      - name: Rapports de vérification et schémas Room
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/schemas/
          retention-days: 14

      - name: Publier l'APK comme artefact téléchargeable
        uses: actions/upload-artifact@v6
        with:
          name: clipsort-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Transmettre la release au job de signature
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: clipsort-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Activer l'accélération de l'émulateur
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tests UI et captures Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/run-ui-tests.sh
      - name: Rapports UI et captures des écrans
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-ui-verification
          path: |
            screenshots/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14

  sign-release:
    needs: [build, ui-tests]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout du certificat public et du script de signature
        uses: actions/checkout@v5

      - name: Configuration JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer les outils de signature Android
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;35.0.0"

      - name: Récupérer la release vérifiée
        uses: actions/download-artifact@v6
        with:
          name: clipsort-release-unsigned
          path: unsigned-release

      - name: Signer et vérifier le certificat stable
        env:
          CLIPSORT_RELEASE_KEYSTORE_BASE64: ${{ secrets.CLIPSORT_RELEASE_KEYSTORE_BASE64 }}
          CLIPSORT_RELEASE_STORE_PASSWORD: ${{ secrets.CLIPSORT_RELEASE_STORE_PASSWORD }}
        run: bash scripts/sign-release.sh unsigned-release/app-release-unsigned.apk signed-release/clipsort-release.apk

      - name: Publier la release signée
        uses: actions/upload-artifact@v6
        with:
          name: clipsort-release-apk
          path: signed-release/
          if-no-files-found: error
          retention-days: 30
